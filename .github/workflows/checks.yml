name: Checks

# Deliberately a separate workflow, not steps in docker-image.yml: by
# convention nothing is verified inside the image build (the emulated arm64
# build OOM-killed the in-image test run). This is where the checks live
# instead — no Docker build, no registry.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Follows go.mod rather than a number kept in step with it by hand.
          go-version-file: go.mod
          cache: true

      # internal/generated_docs/ is generated and gitignored, so a fresh clone
      # does not compile at all: the webserver imports it. `bundle` writes it
      # (swagger.json + VERSION + embedded.go) and is the same step the image
      # build runs. Needs swag only — the TypeScript client that used to be
      # bundled in here lives on npm now, so there is no Node step.
      - name: Generate embedded docs
        run: make bundle

      - name: go vet
        run: go vet ./...

      # Runs even after a failed vet, so one push reports both problems
      # instead of hiding the second behind the first.
      - name: Tests
        if: '!cancelled()'
        run: make test
