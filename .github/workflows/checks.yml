name: Checks

# Deliberately a separate workflow, not steps in docker-image.yml: by
# convention nothing is verified inside the image build (the emulated arm64
# build OOM-killed the in-image test run). This is where the checks live
# instead — no Docker build, no registry.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Follows go.mod rather than a number kept in step with it by hand.
          go-version-file: go.mod
          cache: true

      # internal/generated_docs/ is generated and gitignored, so a fresh clone
      # does not compile at all: the webserver imports it. `bundle` writes it
      # (swagger.json + VERSION + embedded.go) and is the same step the image
      # build runs. Needs swag only — the TypeScript client that used to be
      # bundled in here lives on npm now, so there is no Node step.
      - name: Generate embedded docs
        run: make bundle

      - name: go vet
        run: go vet ./...

      # Runs even after a failed vet, so one push reports both problems
      # instead of hiding the second behind the first.
      - name: Tests
        if: '!cancelled()'
        run: make test

      # internal/roleprovider/api/swagger.json is the input the Go client is
      # generated from, and it is committed. Nothing used to notice when it fell
      # behind the service it describes: the generating target read a sibling
      # checkout and warned rather than failed when it was absent, and it does
      # not run here at all.
      #
      # This holds the committed copy against the release RP_VERSION names, which
      # catches both ways it goes wrong — the pin moved without regenerating, or
      # the file was edited by hand. No Node, no codegen, a couple of seconds.
      #
      # What it deliberately does not cover is client.gen.go itself; verifying
      # that means regenerating, which needs npx swagger2openapi. The spec is the
      # input, and an input that matches is most of the answer.
      - name: Role-provider spec matches the pinned release
        if: '!cancelled()'
        run: |
          set -euo pipefail
          curl -fsSL "$(make --no-print-directory print-rp-swagger-url)" -o "$RUNNER_TEMP/rp.json"
          diff -u internal/roleprovider/api/swagger.json "$RUNNER_TEMP/rp.json"
