name: Checks

# Deliberately a separate workflow, not steps in docker-image.yml: by
# convention nothing is verified inside the image build (the emulated arm64
# build OOM-killed the in-image test run). This is where the checks live
# instead — no Docker build, no registry.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Follows go.mod rather than a number kept in step with it by hand.
          go-version-file: go.mod
          cache: true

      # internal/generated_docs/ is generated and gitignored, so a fresh clone
      # does not compile at all: the webserver imports it. `bundle` writes it
      # (swagger.json + VERSION + embedded.go) and is the same step the image
      # build runs. Needs swag only — the TypeScript client that used to be
      # bundled in here lives on npm now, so there is no Node step.
      - name: Generate embedded docs
        run: make bundle

      - name: go vet
        run: go vet ./...

      # Runs even after a failed vet, so one push reports both problems
      # instead of hiding the second behind the first.
      - name: Tests
        if: '!cancelled()'
        run: make test

      # internal/roleprovider/api/swagger.json is the input the Go client is
      # generated from, and it is committed. Nothing used to notice when it fell
      # behind the service it describes: the generating target read a sibling
      # checkout and warned rather than failed when it was absent, and it does
      # not run here at all.
      #
      # This holds the committed copy against the release RP_VERSION names, which
      # catches both ways it goes wrong — the pin moved without regenerating, or
      # the file was edited by hand. No Node, no codegen, a couple of seconds.
      #
      # It does not cover client.gen.go — that needs Node and a codegen run, so
      # it is its own job below. Kept anyway rather than folded into it: this one
      # costs a couple of seconds and names the discrepancy directly, where the
      # other reports it as a diff in generated Go.
      - name: Role-provider spec matches the pinned release
        if: '!cancelled()'
        run: |
          set -euo pipefail
          curl -fsSL "$(make --no-print-directory print-rp-swagger-url)" -o "$RUNNER_TEMP/rp.json"
          diff -u internal/roleprovider/api/swagger.json "$RUNNER_TEMP/rp.json"

  # The generated role-provider client, held against the spec it claims to come
  # from. Everything about the client is committed, and nothing forced the two to
  # agree: regenerating is a manual step, so moving RP_VERSION without running it
  # left a client that describes the previous release while the pin says
  # otherwise. That mismatch compiles, and shows up as a 404 at runtime.
  #
  # Its own job because it needs Node (swagger2openapi) and the checks job
  # deliberately has none. The generator is pinned in the Makefile: its version
  # goes into the file's header, so an unpinned one would turn every upstream
  # release into a red build here.
  generated-client:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate the role-provider client
        run: make generate-role-provider-client

      # --exit-code on the three generated files by name, not on the whole tree:
      # `npm install` in that target may touch package-lock.json, which is not
      # what this job is asking about.
      - name: It matches what is committed
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            internal/roleprovider/api/swagger.json \
            internal/roleprovider/api/openapi3.json \
            internal/roleprovider/api/client.gen.go \
          || {
            echo "::error::The committed role-provider client does not match RP_VERSION."
            echo "Run 'make generate-role-provider-client' and commit the result."
            exit 1
          }
