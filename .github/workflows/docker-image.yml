name: CI

# DRAFT (release-speedup, not merged): one workflow from push to published artifact, in three jobs:
#   checks   the Checks workflow (checks.yml, needs a workflow_call trigger and no own push trigger), called here on a push to main so a version is only published from a green commit
#   build    the image, in parallel with the checks; on main it is pushed only under its commit (sha-<commit>), which nothing deploys
#   publish  after both: gives the image a version by retagging (no second build), pushes the chart, tags stable releases
#
# Every green commit on main is published, not only the ones that raise VERSION. A commit whose VERSION is already published gets an automatic prerelease version that sorts after it (X.Y.Z-test.N.<run> after X.Y.Z-test.N, X.Y.(Z+1)-0.ci.<run> after a stable X.Y.Z), so the umbrella's bump picks it up and staging, which follows ">=0.0.0-0", runs it a few minutes later. Production pins exact versions in the dhbw-deployment inventory and never sees these.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# One run per branch at a time: GitHub has started two runs for the same push, and the second one failed on creating the release tag the first had just pushed. Waiting (never cancelling) lets the second see the tag and skip.
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  checks:
    # On a pull request checks.yml runs by itself; calling it here as well would run it twice.
    if: github.event_name == 'push'
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2

      - name: Check the chart version matches
        run: make version-check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A "release x.y.z" commit changes nothing but the version numbers, so its image is the previous commit's: retag that one instead of building the same code again.
      - name: Reuse the previous commit's image for a version-only commit
        id: reuse
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          PARENT=$(git rev-parse HEAD^ 2>/dev/null || true)
          OTHER=$(git diff --name-only HEAD^ HEAD 2>/dev/null | grep -vxE 'VERSION|helm-chart/Chart.yaml' || true)
          if [ -n "$PARENT" ] && [ -z "$OTHER" ] && docker buildx imagetools inspect "$IMAGE:sha-$PARENT" >/dev/null 2>&1; then
            docker buildx imagetools create -t "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:sha-$PARENT"
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and on main push under the commit)
        if: steps.reuse.outputs.done != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [checks, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Choose the version
        id: ver
        run: |
          set -euo pipefail
          BASE=$(tr -d '\n' < VERSION)
          if docker buildx imagetools inspect "$IMAGE:$BASE" >/dev/null 2>&1; then
            if [[ "$BASE" == *-* ]]; then
              V="$BASE.$GITHUB_RUN_NUMBER"
            else
              IFS=. read -r MA MI PA <<< "$BASE"
              V="$MA.$MI.$((PA + 1))-0.ci.$GITHUB_RUN_NUMBER"
            fi
            echo "auto=true" >> "$GITHUB_OUTPUT"
          else
            V="$BASE"
            echo "auto=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Give the image its version
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAGS=(-t "$IMAGE:$V")
          [ "${{ steps.ver.outputs.auto }}" = "true" ] || TAGS+=(-t "$IMAGE:latest")
          docker buildx imagetools create "${TAGS[@]}" "$IMAGE:sha-$GITHUB_SHA"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Package and push the Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          NAME=$(awk '/^name:/{print $2; exit}' helm-chart/Chart.yaml)
          if helm show chart "oci://ghcr.io/${{ github.repository_owner }}/charts/$NAME" --version "$V" >/dev/null 2>&1; then
            echo "$NAME $V is already published - nothing to do."
            exit 0
          fi
          helm package helm-chart/ --version "$V" --app-version "$V" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP"/*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"

      # TODO (resume): copy the "Tag and release stable versions" step from main unchanged, conditioned on steps.ver.outputs.auto != 'true' && !contains(steps.ver.outputs.version, '-').

      # Tells the umbrella to pick the new chart up now. Needs secret UMBRELLA_DISPATCH_TOKEN (fine-grained, Actions: write on cloud-self-service); without it the umbrella's schedule applies.
      - name: Trigger the umbrella bump
        env:
          GH_TOKEN: ${{ secrets.UMBRELLA_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "no UMBRELLA_DISPATCH_TOKEN — the umbrella's schedule picks this up"; exit 0; fi
          gh workflow run bump.yml -R "${{ github.repository_owner }}/cloud-self-service" || echo "::warning::could not trigger the umbrella bump"

      # TODO (resume): retention steps from main, plus rules for '^\d+\.\d+\.\d+-(test\.\d+\.\d+|0\.ci\.\d+)$' (keep 3) and '^sha-[0-9a-f]{40}$' (keep 10).
