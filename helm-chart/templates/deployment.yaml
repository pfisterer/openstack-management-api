{{- $comp := dict "context" . "component" "openstack-management" -}}
{{- $name := include "openstack-mangament-api.componentName" $comp -}}
{{- $labels := include "openstack-mangament-api.labels" $comp -}}
{{- $selectors := include "openstack-mangament-api.selectorLabels" $comp -}}
{{- $tlsSecretName := include "openstack-mangament-api.resourceName" (dict "context" . "component" "openstack-management" "name" "tls") -}}
{{- $secretName := default $name .Values.openstackManagementApi.existingSecret -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "openstack-mangament-api.rolloutAnnotations" . | nindent 4 }}
    # Restart this Deployment when the referenced Secret changes (Stakater Reloader)
    secret.reloader.stakater.com/reload: {{ $secretName }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  replicas: {{ .Values.openstackManagementApi.replicas }}
  selector:
    matchLabels:
      {{- $selectors | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "openstack-mangament-api.rolloutAnnotations" . | nindent 8 }}
      labels:
        {{- $selectors | nindent 8 }}
    spec:
      # This pod never talks to the Kubernetes API — do not hand it a token for it.
      automountServiceAccountToken: false
      volumes:
        # Writable scratch so the container rootfs can stay read-only.
        - name: tmp
          emptyDir: {}
      containers:
        - name: openstack-management
          # The tag falls back to this chart's appVersion, which is what makes a
          # pinned chart version pin the image too: under the umbrella chart no
          # version is passed at all, so "new chart, old image" cannot occur.
          # An explicit value still wins — that is how argocd-image-updater
          # keeps driving the standalone releases.
          image: {{ .Values.openstackManagementApi.image }}:{{ .Values.openstackManagementApi.version | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.openstackManagementApi.imagePullPolicy | default "Always" }}
          ports:
            - containerPort: 8083
          # Hardening: non-root, no privilege escalation, no capabilities,
          # read-only rootfs, default seccomp. The image sets USER 65532.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            # ── Database ────────────────────────────────────────────────────
            - name: DB_TYPE
              value: {{ .Values.openstackManagementApi.db.type | quote }}
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: db-connection-string
            - name: DB_ADD_MOCK_DATA
              value: {{ .Values.openstackManagementApi.db.addMockData | toString | quote }}

            # ── OpenStack ────────────────────────────────────────────────────
            - name: OPENSTACK_AUTH_URL
              value: {{ .Values.openstackManagementApi.openstack.authUrl | quote }}
            - name: OPENSTACK_APPLICATION_CREDENTIAL_ID
              value: {{ .Values.openstackManagementApi.openstack.applicationCredentialId | quote }}
            - name: OPENSTACK_APPLICATION_CREDENTIAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: openstack-application-credential-secret
            # Password auth for a service user, the alternative to the
            # application credential above. Configure exactly ONE of the two:
            # when both are complete the application credential wins silently
            # (OpenstackConfiguration.AuthMethod).
            #
            # It exists because an application credential is always scoped to one
            # project and cannot carry a domain or system scope — and creating
            # projects or assigning roles across projects needs one of those on a
            # cloud that enforces the modern RBAC defaults. It is also what makes
            # a smaller blast radius possible at all: a service user that is admin
            # on ONE domain can do everything the reconciler needs inside that
            # domain and nothing outside it.
            - name: OPENSTACK_USERNAME
              value: {{ .Values.openstackManagementApi.openstack.username | quote }}
            - name: OPENSTACK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: openstack-password
                  # optional so deployments using an application credential — and
                  # any existingSecret written before this key existed — still start.
                  optional: true
            - name: OPENSTACK_USER_DOMAIN_NAME
              value: {{ .Values.openstackManagementApi.openstack.userDomainName | quote }}
            # Scope of the requested token, applied in this order:
            # systemScope > domainName > project (projectId, or projectName with
            # projectDomainName). Password auth only; empty means "not this one".
            - name: OPENSTACK_SYSTEM_SCOPE
              value: {{ .Values.openstackManagementApi.openstack.systemScope | quote }}
            - name: OPENSTACK_DOMAIN_NAME
              value: {{ .Values.openstackManagementApi.openstack.domainName | quote }}
            - name: OPENSTACK_PROJECT_NAME
              value: {{ .Values.openstackManagementApi.openstack.projectName | quote }}
            - name: OPENSTACK_PROJECT_DOMAIN_NAME
              value: {{ .Values.openstackManagementApi.openstack.projectDomainName | quote }}
            - name: OPENSTACK_PROJECT_ID
              value: {{ .Values.openstackManagementApi.openstack.projectId | quote }}
            - name: OPENSTACK_REGION
              value: {{ .Values.openstackManagementApi.openstack.region | quote }}
            - name: OPENSTACK_INSECURE
              value: {{ .Values.openstackManagementApi.openstack.insecure | toString | quote }}
            - name: OPENSTACK_FEDERATED_PROVISIONING
              value: {{ .Values.openstackManagementApi.openstack.federatedProvisioning | toString | quote }}
            - name: OPENSTACK_FEDERATED_IDP_ID
              value: {{ .Values.openstackManagementApi.openstack.federatedIdpId | quote }}
            - name: OPENSTACK_FEDERATED_PROTOCOL_ID
              value: {{ .Values.openstackManagementApi.openstack.federatedProtocolId | quote }}
            - name: OPENSTACK_FEDERATED_DOMAIN_ID
              value: {{ .Values.openstackManagementApi.openstack.federatedDomainId | quote }}

            # ── Web Server / API ─────────────────────────────────────────────
            - name: API_BIND
              value: {{ .Values.openstackManagementApi.api.bind | quote }}
            - name: API_BASE_URL
              value: {{ .Values.openstackManagementApi.api.baseUrl | quote }}
            - name: API_TOKEN_TTL_HOURS
              value: {{ .Values.openstackManagementApi.api.tokenTTLHours | toString | quote }}
            - name: API_TOKEN_MAX_TTL_HOURS
              value: {{ .Values.openstackManagementApi.api.tokenMaxTTLHours | toString | quote }}
            - name: API_TOKEN_ALLOW_NEVER_EXPIRES
              value: {{ .Values.openstackManagementApi.api.tokenAllowNeverExpires | toString | quote }}
            - name: API_DUMMY_AUTH
              value: {{ .Values.openstackManagementApi.api.dummyAuth | toString | quote }}
            - name: API_MODE
              value: {{ .Values.openstackManagementApi.api.mode | quote }}
            # Ceiling for authorized_users per project. Each entry costs the
            # reconciler Keystone work on every run, so this bounds what one
            # request can trigger; a whole course goes in as ONE group token.
            - name: API_MAX_AUTHORIZED_USERS
              value: {{ .Values.openstackManagementApi.api.maxAuthorizedUsers | default 32 | toString | quote }}
            {{- /* Explicit rather than `| default true`: that helper treats
                   false as empty and would silently flip an intentional
                   opt-out back on. */}}
            - name: API_CHARGE_OS_IN_USE
              value: {{ dig "chargeOsInUse" true .Values.openstackManagementApi.api | toString | quote }}
            - name: API_CHARGE_RELEASED
              value: {{ dig "chargeReleased" true .Values.openstackManagementApi.api | toString | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ join "," (.Values.openstackManagementApi.api.corsAllowedOrigins | default list) | quote }}

            # ── OIDC ─────────────────────────────────────────────────────────
            - name: OIDC_ISSUER_URL
              value: {{ .Values.openstackManagementApi.oidc.issuerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.openstackManagementApi.oidc.clientId | quote }}

            # ── Reconciler ───────────────────────────────────────────────────
            - name: RECONCILER_ENABLED
              value: {{ .Values.openstackManagementApi.reconciler.enabled | toString | quote }}
            - name: RECONCILER_INTERVAL_SECONDS
              value: {{ .Values.openstackManagementApi.reconciler.intervalSeconds | toString | quote }}
            - name: RECONCILER_GROUP_PREFIX
              value: {{ .Values.openstackManagementApi.reconciler.groupPrefix | quote }}
            - name: RECONCILER_SCOPE_PARENT_ID
              value: {{ .Values.openstackManagementApi.reconciler.scopeParentId | quote }}
            - name: RECONCILER_SCOPE_PARENT_NAME
              value: {{ .Values.openstackManagementApi.reconciler.scopeParentName | default "" | quote }}
            - name: RECONCILER_DRY_RUN
              value: {{ .Values.openstackManagementApi.reconciler.dryRun | toString | quote }}
            # Safety mode: when true the reconciler never performs destructive
            # OpenStack operations (no project/user removal, no released-project
            # deletion) while still syncing/creating. Recommended during rollout.
            - name: RECONCILER_NO_DELETE
              value: {{ .Values.openstackManagementApi.reconciler.noDelete | default false | toString | quote }}
            - name: RECONCILER_MANAGED_PROJECT_TAG
              value: {{ .Values.openstackManagementApi.reconciler.managedProjectTag | quote }}
            - name: RECONCILER_RESOURCE_ID_TAG_PREFIX
              value: {{ .Values.openstackManagementApi.reconciler.resourceIdTagPrefix | quote }}
            - name: RECONCILER_DELETE_RELEASED_PROJECTS
              value: {{ .Values.openstackManagementApi.reconciler.deleteReleasedProjects | toString | quote }}
            - name: RECONCILER_PENDING_DELETION_GRACE_DAYS
              value: {{ .Values.openstackManagementApi.reconciler.pendingDeletionGraceDays | toString | quote }}
            - name: RECONCILER_PENDING_DELETION_TAG_PREFIX
              value: {{ .Values.openstackManagementApi.reconciler.pendingDeletionTagPrefix | quote }}
            - name: RECONCILER_CONTACT_TAG_PREFIX
              value: {{ .Values.openstackManagementApi.reconciler.contactTagPrefix | quote }}
            - name: RECONCILER_DEFAULT_NETWORKS
              value: {{ .Values.openstackManagementApi.reconciler.defaultNetworks | toString | quote }}
            - name: RECONCILER_DEFAULT_SUBNETS
              value: {{ .Values.openstackManagementApi.reconciler.defaultSubnets | toString | quote }}
            - name: RECONCILER_DEFAULT_PORTS
              value: {{ .Values.openstackManagementApi.reconciler.defaultPorts | toString | quote }}
            - name: RECONCILER_DEFAULT_ROUTERS
              value: {{ .Values.openstackManagementApi.reconciler.defaultRouters | toString | quote }}
            - name: RECONCILER_DEFAULT_FLOATING_IPS
              value: {{ .Values.openstackManagementApi.reconciler.defaultFloatingIps | toString | quote }}
            - name: RECONCILER_DEFAULT_SECURITY_GROUPS
              value: {{ .Values.openstackManagementApi.reconciler.defaultSecurityGroups | toString | quote }}
            - name: RECONCILER_DEFAULT_VOLUMES
              value: {{ .Values.openstackManagementApi.reconciler.defaultVolumes | toString | quote }}
            - name: RECONCILER_DEFAULT_SNAPSHOTS
              value: {{ .Values.openstackManagementApi.reconciler.defaultSnapshots | toString | quote }}

            # ── Miscellaneous ────────────────────────────────────────────────
            - name: ROOT_ADMIN_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: root-admin-tokens
            - name: SERVICE_TIMEOUT_SECONDS
              value: {{ .Values.openstackManagementApi.serviceTimeoutSeconds | toString | quote }}

            # ── Role Provider (group/token resolution + group search) ────────
            # "mock" = built-in demo identities; "http" = role-provider-service
            # (real transitive group tokens + group search). For http, set
            # roleProvider.url and provide `role-provider-api-token` in the Secret.
            - name: ROLE_PROVIDER
              value: {{ .Values.openstackManagementApi.roleProvider.type | quote }}
            - name: ROLE_PROVIDER_URL
              value: {{ .Values.openstackManagementApi.roleProvider.url | quote }}
            - name: ROLE_PROVIDER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: role-provider-api-token
                  # optional so mock deployments (no token) don't fail to start.
                  optional: true

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  selector:
    {{- $selectors | nindent 4 }}
  ports:
    - protocol: TCP
      port: 8083
      targetPort: 8083

{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.openstackManagementApi.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: 8083
  tls:
    - hosts:
        - {{ .Values.openstackManagementApi.hostname | quote }}
{{- end }}
