{{- if not .Values.openstackManagementApi.existingSecret }}
{{- $comp := dict "context" . "component" "openstack-management" -}}
{{- $name := include "openstack-mangament-api.componentName" $comp -}}
{{- $labels := include "openstack-mangament-api.labels" $comp -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
stringData:
  db-connection-string: {{ .Values.openstackManagementApi.db.connectionString | quote }}
  openstack-application-credential-secret: {{ .Values.openstackManagementApi.openstack.applicationCredentialSecret | quote }}
  root-admin-tokens: {{ .Values.openstackManagementApi.rootAdminTokens | quote }}
  # Always rendered, empty for roleProvider.type=mock. The deployment reads this
  # key with `optional: true`, so leaving it out did not fail the pod — it made
  # every call to the role provider unauthenticated, visible only as a 401 at
  # runtime. Rendering it unconditionally is what keeps the chart-generated
  # Secret a complete substitute for an existingSecret.
  role-provider-api-token: {{ .Values.openstackManagementApi.roleProvider.apiToken | default "" | quote }}
{{- end }}
