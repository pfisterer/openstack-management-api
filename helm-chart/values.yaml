---
# Dependency condition of the cloud-self-service umbrella chart, which decides by
# this key whether to install this chart at all. Set it there, not here: a
# standalone `helm install` of this chart ignores it entirely.
enabled: true

#------------------------------------
# OpenStack Management API — Image & Replicas
#------------------------------------
openstackManagementApi:
  image: ghcr.io/pfisterer/openstack-management-api
  imagePullPolicy: Always
  # Empty -> the chart\'s appVersion is used (see the deployment template).
  version: ""
  hostname: "os-mgt-api.example.com"
  replicas: 1

  # Name of an existing Secret providing the keys `db-connection-string`,
  # `openstack-application-credential-secret`, `root-admin-tokens` and (optional,
  # only for roleProvider.type=http) `role-provider-api-token`. When set, the
  # chart does NOT create its own Secret and the corresponding plaintext values
  # below (db.connectionString, openstack.applicationCredentialSecret,
  # rootAdminTokens, roleProvider.apiToken) are ignored.
  existingSecret: ""

  #------------------------------------
  # Role Provider (group/token resolution + group search)
  #------------------------------------
  # "mock": built-in demo identities (no external dependency).
  # "http": call role-provider-service for real transitive group tokens and
  #         group search. Set url and apiToken below.
  roleProvider:
    type: "mock"
    url: ""
    # Read-only token for the role provider's API — must be one of ITS
    # `api.tokens`. Stored in a Secret. Only used for type=http; the deployment
    # reads the key with `optional: true`, so an empty value here does not stop
    # the pod from starting, it just makes every call to the role provider
    # unauthenticated. Ignored when existingSecret is set (supply the
    # `role-provider-api-token` key there instead).
    apiToken: ""

  #------------------------------------
  # Database
  #------------------------------------
  db:
    # "postgres" or "memory"
    type: "memory"
    # Full DSN — stored in a Secret
    connectionString: "host=localhost user=postgres password=postgres dbname=openstack_management_api port=5432 sslmode=disable TimeZone=UTC"
    addMockData: true

  #------------------------------------
  # OpenStack Credentials
  #------------------------------------
  openstack:
    authUrl: ""
    applicationCredentialId: ""
    # Stored in a Secret
    applicationCredentialSecret: ""
    projectId: ""

    # Password auth for a service user — the alternative to the application
    # credential above, and the only way to get a domain- or system-scoped
    # token. Configure exactly ONE of the two: with both complete, the
    # application credential wins.
    #
    # A service user that is admin on ONE domain is what makes a small blast
    # radius possible: it can create projects and assign roles inside that
    # domain and nowhere else. An application credential cannot express that,
    # because it is always scoped to a single project.
    username: ""
    # Stored in a Secret
    password: ""
    # The domain the USER lives in (not the scope). Empty falls back to "Default".
    userDomainName: ""
    # Scope of the requested token, applied in this order:
    # systemScope ("all") > domainName > project (projectId, or projectName with
    # projectDomainName). Leave the ones you do not want empty.
    systemScope: ""
    domainName: ""
    projectName: ""
    projectDomainName: ""

    region: "microstack"
    insecure: false

    # Pre-created users must be FEDERATED accounts wherever the cloud logs people
    # in via OIDC. Keystone derives a federated user's id from the identity it is
    # bound to, so a plain local account with the right name is a different user
    # than the one an SSO login lands on — the role is assigned, and the person
    # still sees nothing. Leave false only for clouds with local accounts only.
    federatedProvisioning: false
    # The Keystone identity-provider and protocol ids a pre-created account is
    # bound to, and the domain federated accounts live in. All three are part of
    # the derived user id, so they must match the cloud exactly:
    #   openstack identity provider list
    #   openstack federation protocol list --identity-provider <id>
    federatedIdpId: "keycloak"
    federatedProtocolId: "openid"
    federatedDomainId: "default"

  #------------------------------------
  # Web Server / API
  #------------------------------------
  api:
    bind: ":8083"
    baseUrl: "http://localhost:8083"
    # Lifetime of an API token when the request does not ask for one, and the
    # longest one a caller may ask for. A request over the maximum is refused
    # rather than shortened — a token that dies earlier than the person was told
    # is an outage nobody traces back to the moment they created it.
    tokenTTLHours: 720
    tokenMaxTTLHours: 8760
    # Whether a token may be issued with no expiry at all. On, because the
    # non-interactive callers this exists for — a CI job, a cron script, an
    # agent — have nobody to notice a silent expiry, and an expiry nobody is
    # reminded of is an outage months later rather than a safeguard.
    #
    # What makes it defensible is that the alternative to expiry is visibility:
    # every token is listed with its description and when it was last used, and
    # revoking is one request. A deployment that would rather force rotation
    # sets this to false, and callers then have to name a lifetime.
    tokenAllowNeverExpires: true
    # Set to true to bypass OIDC (development only)
    dummyAuth: false
    # "production" or "development"
    mode: "development"
    # Maximum number of authorized_users entries per project. A course or
    # department belongs in as one group token, not as N individual entries.
    maxAuthorizedUsers: 32
    # Bill a project the LARGER of its declared limit and what OpenStack reports
    # it actually uses, in both the auto-approve check and the budget rollup.
    # On by default: with it off, shrinking a limit after filling the project
    # frees budget on paper while the servers keep running. Turn it off only if
    # the reconciler ever reports inflated usage — that would lock budgets that
    # are genuinely within their limits.
    chargeOsInUse: true
    # Keep a released project booked against its budget until OpenStack has
    # really deleted it. On by default: releasing only tags the project for
    # deletion, so the servers keep running and the capacity stays occupied —
    # freeing the budget at that moment books the same hardware twice. The
    # charge ends on its own once the reconciler sees the project is gone and
    # drops the record. Turn it off to free budgets the moment they are
    # released, accepting the over-booking while the deletion is pending.
    chargeReleased: true
    # Browser origins allowed to call /v1 cross-origin, as full origins
    # ("https://selfservice.example.cloud"). Empty = no cross-origin access,
    # which is right whenever the SPA reaches this API same-origin through a
    # BFF/reverse proxy. Only a UI on its own host needs an entry here.
    corsAllowedOrigins: []

  #------------------------------------
  # OIDC Authentication
  #------------------------------------
  oidc:
    issuerUrl: "https://sso.example.cloud/realms/example"
    clientId: "example-cloud-dns"

  #------------------------------------
  # Reconciler
  #------------------------------------
  reconciler:
    enabled: false
    intervalSeconds: 300
    # Prefix for managed Keystone *group* names. Projects are named after their
    # node ("<node name> [<node id>]") and identified by tag, not by name.
    groupPrefix: "managed-"
    # Limit OS-only import to children of this parent project; empty = no scope
    scopeParentId: ""
    # Name-based alternative to scopeParentId: the reconciler resolves the project
    # by name and creates it if missing. Ignored when scopeParentId is set.
    scopeParentName: ""
    dryRun: false
    # Safety mode: never perform destructive OpenStack operations (project/user
    # removal, released-project deletion) while still syncing/creating.
    noDelete: false
    managedProjectTag: "managed"
    resourceIdTagPrefix: "managed-resource-id:"
    # When false, released projects are tagged for pending deletion instead of deleted
    deleteReleasedProjects: false
    pendingDeletionGraceDays: 30
    pendingDeletionTagPrefix: "pending-deletion:"
    contactTagPrefix: "contact:"
    # Static quota defaults applied at project creation
    defaultNetworks: 2
    defaultSubnets: 4
    defaultPorts: 50
    defaultRouters: 1
    defaultFloatingIps: 2
    defaultSecurityGroups: 10
    defaultVolumes: 10
    defaultSnapshots: 10

  #------------------------------------
  # Miscellaneous
  #------------------------------------
  # Comma-separated list of tokens that grant role-switch (super-admin) access
  rootAdminTokens: ""
  serviceTimeoutSeconds: 30

#------------------------------------
# Ingress
#------------------------------------
ingress:
  enabled: true
  # Empty className -> field omitted -> cluster default IngressClass (Traefik on
  # k3s). No cert-manager annotation: TLS = cluster wildcard default cert.
  className: ""
  annotations: {}
